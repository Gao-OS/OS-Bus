<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-Bus Bus Configuration 1.0//EN" "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<busconfig>
  <type>system</type>
  <listen>unix:path=/run/osbus-security/pro05-complete/reference/bus</listen>
  <auth>EXTERNAL</auth>
  <policy context="default">
    <deny user="*"/>
    <allow user="1100"/>
    <allow user="1101"/>
    <deny own="*"/>
    <deny send_destination="*"/>
    <deny receive_sender="*"/>
  </policy>
  <policy user="1100">
    <allow own="org.foundation.Observer"/>
    <allow send_destination="org.freedesktop.DBus" send_interface="org.freedesktop.DBus" send_path="/org/freedesktop/DBus" send_type="method_call" send_member="Hello"/>
    <allow send_destination="org.freedesktop.DBus" send_interface="org.freedesktop.DBus" send_path="/org/freedesktop/DBus" send_type="method_call" send_member="GetId"/>
    <allow send_destination="org.freedesktop.DBus" send_interface="org.freedesktop.DBus" send_path="/org/freedesktop/DBus" send_type="method_call" send_member="GetNameOwner"/>
    <allow send_destination="org.freedesktop.DBus" send_interface="org.freedesktop.DBus" send_path="/org/freedesktop/DBus" send_type="method_call" send_member="ListNames"/>
    <allow send_destination="org.freedesktop.DBus" send_interface="org.freedesktop.DBus" send_path="/org/freedesktop/DBus" send_type="method_call" send_member="NameHasOwner"/>
    <allow send_destination="org.freedesktop.DBus" send_interface="org.freedesktop.DBus" send_path="/org/freedesktop/DBus" send_type="method_call" send_member="GetConnectionUnixUser"/>
    <allow send_destination="org.freedesktop.DBus" send_interface="org.freedesktop.DBus" send_path="/org/freedesktop/DBus" send_type="method_call" send_member="GetConnectionUnixProcessID"/>
    <allow send_destination="org.freedesktop.DBus" send_interface="org.freedesktop.DBus" send_path="/org/freedesktop/DBus" send_type="method_call" send_member="RequestName"/>
    <allow send_destination="org.freedesktop.DBus" send_interface="org.freedesktop.DBus" send_path="/org/freedesktop/DBus" send_type="method_call" send_member="AddMatch"/>
    <allow receive_sender="org.freedesktop.DBus" receive_type="method_return"/>
    <allow receive_sender="org.freedesktop.DBus" receive_type="error"/>
    <allow receive_sender="org.freedesktop.DBus" receive_type="signal" receive_interface="org.freedesktop.DBus" receive_member="NameAcquired"/>
    <allow receive_type="signal" receive_interface="org.foundation.Probe" receive_path="/probe" receive_member="Changed"/>
  </policy>
  <policy user="1101">
    <allow send_destination="org.freedesktop.DBus" send_interface="org.freedesktop.DBus" send_path="/org/freedesktop/DBus" send_type="method_call" send_member="Hello"/>
    <allow send_destination="org.freedesktop.DBus" send_interface="org.freedesktop.DBus" send_path="/org/freedesktop/DBus" send_type="method_call" send_member="GetId"/>
    <allow send_destination="org.freedesktop.DBus" send_interface="org.freedesktop.DBus" send_path="/org/freedesktop/DBus" send_type="method_call" send_member="GetNameOwner"/>
    <allow send_destination="org.freedesktop.DBus" send_interface="org.freedesktop.DBus" send_path="/org/freedesktop/DBus" send_type="method_call" send_member="ListNames"/>
    <allow send_destination="org.freedesktop.DBus" send_interface="org.freedesktop.DBus" send_path="/org/freedesktop/DBus" send_type="method_call" send_member="NameHasOwner"/>
    <allow send_destination="org.freedesktop.DBus" send_interface="org.freedesktop.DBus" send_path="/org/freedesktop/DBus" send_type="method_call" send_member="GetConnectionUnixUser"/>
    <allow send_destination="org.freedesktop.DBus" send_interface="org.freedesktop.DBus" send_path="/org/freedesktop/DBus" send_type="method_call" send_member="GetConnectionUnixProcessID"/>
    <allow send_destination="org.freedesktop.DBus" send_interface="org.freedesktop.DBus" send_path="/org/freedesktop/DBus" send_type="method_call" send_member="RequestName"/>
    <allow send_destination="org.freedesktop.DBus" send_interface="org.freedesktop.DBus" send_path="/org/freedesktop/DBus" send_type="method_call" send_member="AddMatch"/>
    <allow receive_sender="org.freedesktop.DBus" receive_type="method_return"/>
    <allow receive_sender="org.freedesktop.DBus" receive_type="error"/>
    <allow receive_sender="org.freedesktop.DBus" receive_type="signal" receive_interface="org.freedesktop.DBus" receive_member="NameAcquired"/>
    <allow send_type="signal" send_interface="org.foundation.Probe" send_path="/probe" send_member="Changed"/>
  </policy>
  <limit name="auth_timeout">1500</limit>
  <limit name="max_message_size">1048576</limit>
  <limit name="max_completed_connections">32</limit>
  <limit name="max_incomplete_connections">8</limit>
  <limit name="max_connections_per_user">16</limit>
</busconfig>
