<busconfig>
  <policy user="foundationSvc">
    <allow own="org.foundation.Activation.Echo"/>
    <allow own="org.foundation.Activation.Flood"/>
  </policy>
  <policy user="foundationA">
    <allow send_destination="org.foundation.Activation.Echo" send_interface="org.foundation.Activation"/>
    <allow send_destination="org.foundation.Activation.Flood" send_interface="org.foundation.Activation"/>
  </policy>
  <policy user="foundationB">
    <deny send_destination="org.foundation.Activation.Echo"/>
    <deny send_destination="org.foundation.Activation.Flood"/>
  </policy>
</busconfig>
