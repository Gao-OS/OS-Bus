name: Test

on:
  push:
    branches: [ '*' ]

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest

    env:
      MIX_ENV: test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Elixir
        uses: erlef/setup-beam@v1
        with:
          elixir-version: '1.18'
          otp-version: '28'

      - name: Restore dependencies cache
        uses: actions/cache@v4
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-mix-${{ hashFiles('**/mix.lock', '**/mix.exs') }}
          restore-keys: ${{ runner.os }}-mix-

      - name: Install dependencies
        run: mix deps.get

      - name: Run tests
        shell: bash
        run: |
          task_bus_dir=$(mktemp -d /tmp/os-bus-test.XXXXXX)
          trap 'rm -rf "$task_bus_dir"' EXIT
          export DBUS_SOCKET_PATH="$task_bus_dir/boot"
          export DBUS_SYSTEM_BUS_ADDRESS="unix:path=$task_bus_dir/boot"
          export DBUS_SESSION_BUS_ADDRESS="unix:path=$task_bus_dir/boot"
          export GAO_CONFIG_STORE_PATH="$task_bus_dir/config" GAO_CONFIG_CONNECT=false
          export GAO_BUS_CLUSTER=false
          mix test
