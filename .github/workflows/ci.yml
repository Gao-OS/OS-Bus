name: CI

on:
  push:
    branches: [ '*' ]
  workflow_dispatch:
    inputs:
      locked_inputs_ready:
        description: 'Run Mix checks only after the ledger acquisition prerequisites are met'
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  scope:
    name: Report held build gates
    if: ${{ github.event_name != 'workflow_dispatch' || !inputs.locked_inputs_ready }}
    runs-on: ubuntu-latest
    steps:
      - name: Record the input block
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<'EOF'
          ## BLOCKED_INPUT: Mix checks were not executed
          Locked dependency/Hex preparation still requires the protected-identity
          metadata or a reviewed acquisition plan recorded in STATUS.md.
          Push does not authorize acquiring those inputs on another runner.
          Compile, format, Credo and Dialyzer remain UNRUN for this run.
          This reporting job is not passing evidence for any of those gates.
          Highest verified foundation readiness remains L0; product_qualified=false.
          EOF

  compile:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.locked_inputs_ready }}

    name: Compile
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Elixir
        uses: erlef/setup-beam@v1
        with:
          elixir-version: '1.18'
          otp-version: '28'

      - name: Restore dependencies cache
        uses: actions/cache@v4
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-mix-${{ hashFiles('**/mix.lock', '**/mix.exs') }}
          restore-keys: ${{ runner.os }}-mix-

      - name: Install dependencies
        run: mix deps.get

      - name: Compile with warnings as errors
        run: mix compile --warnings-as-errors

  format:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.locked_inputs_ready }}
    name: Format Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Elixir
        uses: erlef/setup-beam@v1
        with:
          elixir-version: '1.18'
          otp-version: '28'

      - name: Restore dependencies cache
        uses: actions/cache@v4
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-mix-${{ hashFiles('**/mix.lock', '**/mix.exs') }}
          restore-keys: ${{ runner.os }}-mix-

      - name: Install dependencies
        run: mix deps.get

      - name: Check code formatting
        run: mix format --check-formatted

  credo:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.locked_inputs_ready }}
    name: Credo
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Elixir
        uses: erlef/setup-beam@v1
        with:
          elixir-version: '1.18'
          otp-version: '28'

      - name: Restore dependencies cache
        uses: actions/cache@v4
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-mix-${{ hashFiles('**/mix.lock', '**/mix.exs') }}
          restore-keys: ${{ runner.os }}-mix-

      - name: Install dependencies
        run: mix deps.get

      - name: Run Credo
        run: mix credo

  dialyzer:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.locked_inputs_ready }}
    name: Dialyzer
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Elixir
        uses: erlef/setup-beam@v1
        with:
          elixir-version: '1.18'
          otp-version: '28'

      - name: Restore dependencies cache
        uses: actions/cache@v4
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-mix-${{ hashFiles('**/mix.lock', '**/mix.exs') }}
          restore-keys: ${{ runner.os }}-mix-

      - name: Install dependencies
        run: mix deps.get

      - name: Restore Dialyzer PLT cache
        uses: actions/cache@v4
        id: plt-cache
        with:
          path: priv/plts
          key: ${{ runner.os }}-plt-v2-otp28-elixir1.18-${{ hashFiles('**/mix.lock', '**/mix.exs') }}
          restore-keys: |
            ${{ runner.os }}-plt-v2-otp28-elixir1.18-

      - name: Create PLTs directory
        run: mkdir -p priv/plts

      - name: Run Dialyzer
        run: mix dialyzer
