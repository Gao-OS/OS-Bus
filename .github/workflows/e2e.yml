name: E2E

on:
  workflow_dispatch:
    inputs:
      run_security:
        description: 'Run security VM only after separate authorization and input preparation'
        type: boolean
        default: false
      run_conformance:
        description: 'Run strict conformance only after deferred acceptance is authorized'
        type: boolean
        default: false
      version:
        description: 'Release version to test (e.g. 0.2.0) — checks out v{version} tag'
        required: false
        type: string
      gate:
        description: 'E2E gate to run'
        required: false
        type: choice
        options:
          - smoke
          - release
          - compat
          - stress
          - all
  schedule:
    - cron: '0 3 * * *'
  pull_request:
    branches: [ main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  scope:
    name: Report held acceptance gates
    if: ${{ github.event_name != 'workflow_dispatch' || (!inputs.run_security && !inputs.run_conformance) }}
    runs-on: ubuntu-latest
    steps:
      - name: Record the acceptance hold
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<'EOF'
          ## BLOCKED/UNRUN: acceptance was not executed
          Security tests are prohibited and VM acceptance is deferred in the current scope.
          Scheduled and PR events do not authorize either held qualification job.
          Each manual input requires future authorization and the prerequisites in STATUS.md.
          Skipped jobs and this reporting job provide no acceptance evidence.
          Highest verified readiness remains L0; product_qualified=false.
          EOF

  security:
    name: security (Linux, frozen system fixture)
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_security }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      MIX_ENV: test
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.version && format('v{0}', inputs.version) || github.ref }}

      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Run pinned composite security qualification
        run: |
          task_devenv=$(nix-build --no-out-link --expr '
            let
              locked = (builtins.fromJSON (builtins.readFile ./devenv.lock)).nodes.nixpkgs-src.locked;
              source = builtins.fetchTree { type = "github"; inherit (locked) owner repo rev narHash; };
              pkgs = import source.outPath { system = "x86_64-linux"; };
            in pkgs.devenv')
          "$task_devenv/bin/devenv" shell -- bash -euc '
            mix local.hex --force
            mix local.rebar --force
            mix deps.get
            scripts/security-qualify test/reports/foundation/security-ci
          '

      - name: Upload security qualification artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-qualification
          path: |
            test/reports/foundation/security-ci
            _build/test/e2e_artifacts
          if-no-files-found: error

  conformance:
    name: e2e (${{ matrix.backend }}, ${{ matrix.gate }})
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_conformance }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        backend: [reference, gao_bus]
        gate: ${{ fromJSON(github.event_name == 'schedule' && '["compat"]' || github.event_name == 'workflow_dispatch' && inputs.gate != '' && format('["{0}"]', inputs.gate) || '["smoke","release"]') }}

    env:
      MIX_ENV: test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.version && format('v{0}', inputs.version) || github.ref }}

      - name: Set up Elixir
        uses: erlef/setup-beam@v1
        with:
          elixir-version: '1.18'
          otp-version: '28'

      - name: Restore dependencies cache
        uses: actions/cache@v4
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-mix-e2e-${{ hashFiles('**/mix.lock', '**/mix.exs') }}
          restore-keys: ${{ runner.os }}-mix-e2e-

      - name: Install dependencies
        run: mix deps.get

      - name: Install D-Bus and interop tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y dbus dbus-user-session libglib2.0-bin libglib2.0-dev gcc pkg-config

      - name: Build C fixture
        run: make -C apps/gao_bus_test/test/fixture

      - name: Run strict conformance qualification
        run: scripts/e2e-qualify '${{ matrix.backend }}' '${{ matrix.gate }}'

      - name: Run preserved reference E2E regressions
        if: matrix.backend == 'reference'
        run: |
          task_bus_dir=$(mktemp -d /tmp/os-bus-legacy.XXXXXX)
          trap 'rm -rf "$task_bus_dir"' EXIT
          export DBUS_SOCKET_PATH="$task_bus_dir/boot"
          export DBUS_SYSTEM_BUS_ADDRESS="unix:path=$task_bus_dir/boot"
          export DBUS_SESSION_BUS_ADDRESS="unix:path=$task_bus_dir/boot"
          export GAO_CONFIG_STORE_PATH="$task_bus_dir/config" GAO_CONFIG_CONNECT=false
          E2E_BACKEND=reference E2E_GATE=all mix test --no-start test/e2e/{bus_semantics,concurrency,error_path,introspection,method_call,property,signal}_test.exs --only e2e
        working-directory: apps/gao_bus_test

      - name: Upload E2E artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-artifacts-${{ matrix.backend }}-${{ matrix.gate }}
          path: |
            _build/test/e2e_artifacts
            apps/gao_bus_test/_build/test/e2e_artifacts
          if-no-files-found: ignore
